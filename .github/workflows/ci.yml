name: Checks

# Runs on every push to main and on pull requests: translations, kit consistency, kit script tests, UI tests and the Rust code.
# The release workflow (release.yml) only builds; it does not run these.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: System libraries for Tauri
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: pip install python-docx openpyxl markdown pypdf Pillow

      - name: Translations
        run: node tools/check_i18n.js
      - name: Kit consistency
        working-directory: kit/_TEMPLATE
        run: python3 ./--settings/scripts/verify_consistency.py
      - name: Kit script tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Tests follow the code
        run: bash tools/check_tests_follow_code.sh
      - name: UI tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node tools/ui-tests/run.js
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  # The app ships for Apple Silicon, Intel Macs and Windows (release.yml builds all three), so the same checks run on each of them.
  # The browser-driven UI tests also run on each of them: file paths and fonts differ per OS.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: pip install python-docx openpyxl markdown pypdf Pillow
      - name: Kit script tests
        run: python -m unittest discover -s tools/tests -v
      - name: Rust
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: UI tests
        run: |
          npm install --no-save playwright
          npx playwright install chromium
          node tools/ui-tests/run.js
      - name: Real kit download and update from GitHub
        working-directory: src-tauri
        run: cargo test -- --ignored the_published_kit --nocapture
      - name: The daily task in the real Task Scheduler (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test -- --ignored the_daily_task_is_registered_and_removed_on_windows --nocapture
